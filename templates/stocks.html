{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-0">Stocks</h2>
      <p class="text-muted mb-0">Manage your stock levels</p>
    </div>
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
      <i class="bi bi-plus-circle me-1"></i> Add Stock
    </button>
  </div>

  <!-- Modal (unchanged) -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Add Stocks</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form method="post" action="/add_stocks">
            <div class="mb-3">
              <label class="form-label">Select Product</label>
              <select class="form-select" name="pid">
                <option selected>Select Product</option>
                {% for product in product_data %}
                <option value="{{ product[0] }}">{{ product[1] }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Stock Quantity</label>
              <input type="number" name="quantity" class="form-control" required>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              <button type="submit" class="btn btn-primary">Add Stock</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Table (styled) -->
  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <table id="example" class="table table-striped table-hover mb-0">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Product ID</th>
            <th>Stock Quantity</th>
            <th>Created At</th>
          </tr>
        </thead>
        <tbody>
          {% for stock in stocks_data %}
          <tr>
            <td>{{ stock[0] }}</td>
            <td>{{ stock[1] }}</td>
            <td>{{ stock[2] }}</td>
            <td>{{ stock[3] }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

</div>
{% endblock %}
