{% extends "base.html" %}

{% block content %}
<div class="container">
  <h1>Sales</h1>
  <!-- Button trigger modal -->
  <div>
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
      Add Sales
    </button>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Add a Sale</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form method="post" action="/add_sales">
              <div class="mb-3">
                <select class="form-select" name='pid' aria-label="Default select example">
                  <option selected>Select Product</option>
                  {% for product in product_data %}
                  <option value="{{product[0]}}">{{product[1]}}</option>
                  {% endfor %}
                </select>

                <div class="mb-3">
                  <label for="exampleInputPassword1" class="form-label">Quantity</label>
                  <input type="number" name="quantity" class="form-control" id="exampleInputPassword1">
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                  <button type="submit" class="btn btn-primary">Add a Sale</button>
                </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>


  <div>
    <table id="example" class="table table-striped">
      <thead>
        <tr>
          <th>id</th>
          <th>pid</th>
          <th>Quantity</th>
          <th>Created at</th>
        </tr>
      </thead>
      <tbody>
        {% for sale in sales_data%}
        <tr>
          <td>{{sale[0]}}</td>
          <td>{{sale[1]}}</td>
          <td>{{sale[2]}}</td>
          <td>{{sale[3]}}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
